<svg width="344" height="154.5" viewBox="0 0 344 154.5" fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    .header {
      font: 600 16px "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      fill: #1F2328;
    }

    .lang-name {
      font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 12px;
    }

    .lang-name-bold {
      font-weight: 600;
      fill: #1F2328;
    }

    .lang-percent {
      font-weight: 400;
      fill: #59636E;
    }
  </style>

  <rect height="100%" width="100%" fill="#FFFFFF" rx="6" ry="6" stroke="#DFE4E9" stroke-width="2"/>

  <g transform="translate(24, 0)">
    <g transform="translate(0, 36)">
      <text class="header">Languages</text>
    </g>

    <g transform="translate(0, 48)">
      <svg height="8" width="296" xmlns="http://www.w3.org/2000/svg">
        <mask id="rect-mask">
          <rect x="0" y="0" width="100%" height="100%" fill="white" rx="5"/>
        </mask>
        <circle id="legend-dot" cx="5" cy="6" r="4.5"/>

        
        
          <rect mask="url(#rect-mask)" x="0%" y="0" width="27%" height="100%" fill="#f1e05a"/>
          
        
          <rect mask="url(#rect-mask)" x="27%" y="0" width="22.7%" height="100%" fill="#00ADD8"/>
           
            <rect x="27%" y="0" width="0.6%" height="100%" fill="#FFFFFF"/>
          
        
          <rect mask="url(#rect-mask)" x="49.7%" y="0" width="15%" height="100%" fill="#ff3e00"/>
           
            <rect x="49.7%" y="0" width="0.6%" height="100%" fill="#FFFFFF"/>
          
        
          <rect mask="url(#rect-mask)" x="64.7%" y="0" width="12.5%" height="100%" fill="#b07219"/>
           
            <rect x="64.7%" y="0" width="0.6%" height="100%" fill="#FFFFFF"/>
          
        
          <rect mask="url(#rect-mask)" x="77.2%" y="0" width="12.3%" height="100%" fill="#3572A5"/>
           
            <rect x="77.2%" y="0" width="0.6%" height="100%" fill="#FFFFFF"/>
          
        
          <rect mask="url(#rect-mask)" x="89.5%" y="0" width="10.5%" height="100%" fill="#F0F6FC"/>
           
            <rect x="89.5%" y="0" width="0.6%" height="100%" fill="#FFFFFF"/>
          
        
      </svg>

      
        
          <g transform="translate(0, 25)">
            <circle cx="5" cy="6" r="4.5" fill="#f1e05a"/>
            <text x="18" y="10.5" class="lang-name">
              <tspan class="lang-name-bold">JavaScript</tspan>
              <tspan class="lang-percent">27%</tspan>
            </text>
          </g>
        
          <g transform="translate(150, 25)">
            <circle cx="5" cy="6" r="4.5" fill="#00ADD8"/>
            <text x="18" y="10.5" class="lang-name">
              <tspan class="lang-name-bold">Go</tspan>
              <tspan class="lang-percent">22.7%</tspan>
            </text>
          </g>
        
          <g transform="translate(0, 45)">
            <circle cx="5" cy="6" r="4.5" fill="#ff3e00"/>
            <text x="18" y="10.5" class="lang-name">
              <tspan class="lang-name-bold">Svelte</tspan>
              <tspan class="lang-percent">15%</tspan>
            </text>
          </g>
        
          <g transform="translate(150, 45)">
            <circle cx="5" cy="6" r="4.5" fill="#b07219"/>
            <text x="18" y="10.5" class="lang-name">
              <tspan class="lang-name-bold">Java</tspan>
              <tspan class="lang-percent">12.5%</tspan>
            </text>
          </g>
        
          <g transform="translate(0, 65)">
            <circle cx="5" cy="6" r="4.5" fill="#3572A5"/>
            <text x="18" y="10.5" class="lang-name">
              <tspan class="lang-name-bold">Python</tspan>
              <tspan class="lang-percent">12.3%</tspan>
            </text>
          </g>
        
          <g transform="translate(150, 65)">
            <circle cx="5" cy="6" r="4.5" fill="#F0F6FC"/>
            <text x="18" y="10.5" class="lang-name">
              <tspan class="lang-name-bold">Other (2)</tspan>
              <tspan class="lang-percent">10.5%</tspan>
            </text>

cards:
  - output: languages-dark.svg
    theme: dark
    header: Languages
    mode: geometric
    max_langs: 6
    ignore: &ignore
      - Jupyter Notebook
      - HTML
      - CSS
      - NSIS
      - PowerShell
      - Shell
      - Makefile
      - QML
      - Svelte

  - output: languages-light.svg
    theme: light
    header: Languages
    mode: geometric
    max_langs: 6
    ignore: *ignore

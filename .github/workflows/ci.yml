name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "stats.yml"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "stats.yml"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -race ./... -v
